# secret-validation.yml — block secrets from entering the repo.
# Layered: trufflehog (when available) for verified-secret detection, plus a
# zero-dependency grep fallback that catches the common high-signal patterns
# and any tracked .env / .env.* file. ithacus has ZERO runtime deps and must
# never ship credentials (PREVENT-003, AGENT_GUARDRAILS NO SECRETS rule).
name: Secret Validation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trufflehog (verified secrets)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --only-verified --fail

      - name: Grep fallback (high-signal patterns)
        run: |
          set -e
          # Scan committed TS under src/ and extensions/ for common
          # high-signal secret shapes. Example/placeholder/test tokens are
          # exempted via the grep -v filter on the matched line.
          found=0
          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            # Skip obvious placeholders/examples/tests on the matched line.
            if echo "$hit" | grep -qiE '(example|placeholder|test|mock|sample|dummy|fake|your_|replace_|xxx)'; then
              continue
            fi
            echo "::error::High-signal secret pattern: $hit"
            found=1
          done < <(git grep -nE \
            'AKIA[0-9A-Z]{16}|eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}' \
            -- 'src/' 'extensions/' 'scripts/' 2>/dev/null || true)
          if [ "$found" -ne 0 ]; then
            echo "::error::Secret pattern matched — review the lines above (or annotate as a known mock)."
            exit 1
          fi
          echo "No secrets matched."

      - name: No .env files tracked
        run: |
          if git ls-files -- '.env' '.env.*' | grep -q .; then
            echo "::error::.env file is tracked — add to .gitignore, never commit (PREVENT-003)."
            git ls-files -- '.env' '.env.*'
            exit 1
          fi
